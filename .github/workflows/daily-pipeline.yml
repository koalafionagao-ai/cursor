name: AI Daily Pipeline

on:
  schedule:
    # 北京时间约 09:00（UTC 01:00）— Techmeme 当日早报已出，整合前一日简报
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "简报日期 YYYY-MM-DD（默认：北京时间昨日）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Daily_Parser/requirements.txt

      - name: Resolve target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            python3 -c "from datetime import timedelta; from zoneinfo import ZoneInfo; from datetime import datetime; d=(datetime.now(ZoneInfo('Asia/Shanghai')).date()-timedelta(days=1)); print('target='+d.isoformat())" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Techmeme
        run: python3 Daily_Parser/techmeme_fetcher.py --date ${{ steps.date.outputs.target }}

      - name: Fetch TLDR AI
        run: python3 Daily_Parser/tldr_fetcher.py --date ${{ steps.date.outputs.target }}

      - name: Merge & clean (Agent2)
        run: python3 Daily_Parser/merge_cleaner.py --date ${{ steps.date.outputs.target }}

      - name: Filter score (Agent3)
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Daily_Parser/filter_scorer.py --date ${{ steps.date.outputs.target }}

      - name: Enrich translate (Agent4)
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Daily_Parser/enrich.py --date ${{ steps.date.outputs.target }}

      - name: Build site data (Agent5)
        run: python3 Daily_Parser/build_site_data.py --date ${{ steps.date.outputs.target }}

      - name: Finalize pipeline log
        if: always()
        continue-on-error: true
        run: python3 Daily_Parser/finalize_pipeline_log.py --date ${{ steps.date.outputs.target }}

      - name: Pipeline summary
        if: always()
        run: |
          D=${{ steps.date.outputs.target }}
          M=${D:0:7}
          LOG="Daily_Parser/logs/pipeline/$M/$D.json"
          echo "## AI Daily Pipeline — $D" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOG" ]; then
            python3 -c "
          import json
          from pathlib import Path
          data = json.loads(Path('$LOG').read_text(encoding='utf-8'))
          print(f\"- Overall: **{data.get('overall_status')}** (run {data.get('run_id')})\")
          for s in data.get('steps') or []:
              m = s.get('metrics') or {}
              vol = ', '.join(f\"{k}={v}\" for k, v in m.items()) if m else '—'
              flag = s.get('status')
              print(f\"- [{s.get('step_order')}] {s.get('component')}: **{flag}** — {vol}\")
              if s.get('error'):
                  print(f\"  - error: {s['error']}\")
              elif s.get('status') in ('warning', 'skipped'):
                  print(f\"  - note: {s.get('result')}\")
          " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Pipeline log not found at $LOG" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit pipeline outputs
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Daily_Parser/Techmeme Daily_Parser/TLDR Daily_Parser/Processed Daily_Parser/site/data Daily_Parser/logs/pipeline
          git diff --cached --quiet || git commit -m "chore(daily): ${{ steps.date.outputs.target }}"
          git push
