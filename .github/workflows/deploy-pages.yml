name: Deploy AI Daily to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Daily_Parser/site/**"
      - "Daily_Parser/build_site_data.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["AI Daily Pipeline"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure site data is current
        run: python3 Daily_Parser/build_site_data.py

      - name: Prepare Pages artifact (cursor/ai_daily)
        run: |
          mkdir -p _pages/ai_daily
          cp -r Daily_Parser/site/. _pages/ai_daily/
          cat > _pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=ai_daily/">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>AI Daily</title>
            <link rel="canonical" href="ai_daily/">
          </head>
          <body>
            <p><a href="ai_daily/">AI Daily 简报</a></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
