<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FDFCF8">
  <meta name="base-path" content="/ai-daily/">
  <title>AI Daily | Fiona Gao</title>
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/layout-patch.css">
  <link rel="stylesheet" href="assets/mobile.css">
</head>
<body>

  <header class="header header-bar">
    <div class="header-row">
      <a href="https://koalafionagao-ai.github.io/my_blogs/" id="blog-link" rel="noopener noreferrer" class="header-back" aria-label="Blog">
        <span class="header-back-short" aria-hidden="true">←</span>
        <span class="header-back-long">← Blog</span>
      </a>
      <h1 id="page-title" class="header-title">AI 简报</h1>
      <div class="lang-toggle header-lang">
        <button type="button" class="lang-btn" id="btn-en"><span class="lang-long">English</span><span class="lang-short">En</span></button>
        <button type="button" class="lang-btn active" id="btn-zh"><span class="lang-long">中文</span><span class="lang-short">中</span></button>
      </div>
    </div>
    <nav class="mobile-top-nav mobile-only" id="mobile-top-nav" aria-label="主导航" hidden>
      <button type="button" class="mobile-nav-btn" data-nav-panel="date" id="btn-mobile-nav-date">
        <span class="mobile-nav-label">时间</span>
        <span class="mobile-nav-sub" id="mobile-nav-date-sub">—</span>
      </button>
      <button type="button" class="mobile-nav-btn" data-nav-panel="hub" id="btn-mobile-nav-hub">
        <span class="mobile-nav-label">看板</span>
        <span class="mobile-nav-sub" id="mobile-nav-hub-sub">—</span>
      </button>
      <button type="button" class="mobile-nav-btn" data-nav-panel="filter" id="btn-mobile-nav-filter">
        <span class="mobile-nav-label">筛选</span>
        <span class="mobile-nav-sub" id="mobile-nav-filter-sub">分类·标签</span>
      </button>
    </nav>
    <div class="mobile-header-toolbar mobile-only" id="mobile-header-toolbar" hidden></div>
  </header>

  <div class="layout-container">
    <aside class="sidebar-left" id="left-nav"></aside>
    <main class="main-content" id="main-panel">
      <div class="empty">Loading…</div>
    </main>
    <aside class="sidebar-right" id="tag-panel"></aside>
  </div>

  <div class="mobile-overlay mobile-only" id="mobile-overlay" hidden></div>

  <div class="mobile-date-sheet mobile-only" id="mobile-date-sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="mobile-sheet-head">
      <h2 id="mobile-date-sheet-title">选择日期</h2>
      <button type="button" class="mobile-sheet-close" id="btn-date-sheet-close" aria-label="关闭">×</button>
    </div>
    <div class="mobile-date-sheet-body nav-scroll" id="mobile-date-sheet-body"></div>
  </div>

  <div class="mobile-hub-sheet mobile-only" id="mobile-hub-sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="mobile-sheet-head">
      <h2 id="mobile-hub-sheet-title">本月看板</h2>
      <button type="button" class="mobile-sheet-close" id="btn-hub-sheet-close" aria-label="关闭">×</button>
    </div>
    <div class="mobile-hub-sheet-body" id="mobile-hub-panel"></div>
  </div>

  <aside class="mobile-filter-drawer mobile-only" id="mobile-filter-drawer" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="mobile-drawer-head">
      <h2>筛选</h2>
      <button type="button" class="mobile-drawer-close" id="btn-filter-drawer-close" aria-label="关闭">×</button>
    </div>
    <div class="mobile-drawer-body" id="mobile-filter-panel"></div>
  </aside>

  <footer class="footer">
    <div id="footer-text">© 2026 Fiona Gao · AI Daily · <a href="https://github.com/koalafionagao-ai" target="_blank" rel="noopener noreferrer">GitHub</a></div>
  </footer>

  <script src="assets/tag-groups.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
